[project]
name = "cinema-follower"
version = "0.0.1"
description = ""
authors = [
    {name = "Darya Nestsiarovich",email = "tgrfzb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask (==3.0.3)",
    "requests (==2.32.3)",
    "themoviedb (==1.0.2)",
    "oauthlib (==3.2.2)",
    "pyopenssl (==24.3.0)",
    "flask-login (==0.6.3)",
    "coloredlogs (>=15.0.1,<16.0.0)",
    "google-api-python-client (>=2.183.0,<3.0.0)",
    "google-auth-httplib2 (>=0.2.0,<0.3.0)",
    "google-auth-oauthlib (>=1.2.2,<2.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "flask-rq (>=0.3.3,<0.4.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
cinema-follower = "cinema_follower.__init__:main"
rq-worker = "cinema_follower.__init__:rq_worker"
